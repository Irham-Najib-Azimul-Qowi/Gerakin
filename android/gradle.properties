org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation (much faster rebuilds)
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
# Gradle daemon untuk cache build (sangat mempercepat)
org.gradle.daemon=true
# Parallel execution disabled to prevent dexing deadlock
org.gradle.parallel=false
org.gradle.caching=true
android.suppressUnsupportedCompileSdk=36
android.ndk.suppressNdkError=true